name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, sqlite3, pdo_sqlite, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Start MySQL
        if: matrix.database == 'mysql'
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE crime_alert_test"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          if [ "${{ matrix.database }}" = "mysql" ]; then
            sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
            echo 'DB_HOST=127.0.0.1' >> .env
            echo 'DB_PORT=3306' >> .env
            echo 'DB_DATABASE=crime_alert_test' >> .env
            echo 'DB_USERNAME=root' >> .env
            echo 'DB_PASSWORD=root' >> .env
          fi

      - name: Verify migrations run on a fresh database
        run: php artisan migrate:fresh --force --seed

      - name: Run tests
        run: php artisan test

  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, sqlite3, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check code style (Pint)
        run: vendor/bin/pint --test
