name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, sqlite3, pdo_sqlite, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Start MySQL
        if: matrix.database == 'mysql'
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE crime_alert_test"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          if [ "${{ matrix.database }}" = "mysql" ]; then
            # Issue #283: phpunit.xml's <env> DB_CONNECTION=sqlite/DB_DATABASE=
            # :memory: cannot be beaten from .env — Laravel never exports .env
            # into the process environment, and PHPUnit only skips its own
            # putenv() when getenv($name) !== false (PhpHandler.php:112). The
            # mysql leg must therefore carry DB_* as PROCESS env, which
            # $GITHUB_ENV provides. The old sed -i .env here silently kept
            # this job running sqlite for the repo's entire history.
            {
              echo 'DB_CONNECTION=mysql'
              echo 'DB_HOST=127.0.0.1'
              echo 'DB_PORT=3306'
              echo 'DB_DATABASE=crime_alert_test'
              echo 'DB_USERNAME=root'
              echo 'DB_PASSWORD=root'
            } >> "$GITHUB_ENV"
          fi

      - name: Tripwire - the connection under test matches the matrix leg
        # Fails the job here rather than letting it go green on the wrong
        # dialect again if the precedence mechanism ever shifts (#283).
        run: php artisan db:show --json | grep -q '"driver":"${{ matrix.database }}"'

      - name: Verify migrations run on a fresh database
        run: php artisan migrate:fresh --force --seed

      - name: Run tests
        run: php artisan test

  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, sqlite3, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check code style (Pint)
        run: vendor/bin/pint --test
